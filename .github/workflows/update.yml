name: Update Data

on:
    schedule:
        - cron: "0 0 * * *"
    workflow_dispatch:

jobs:
    update-data:
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v4
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
            - name: Run index.js
              run: node index.js
